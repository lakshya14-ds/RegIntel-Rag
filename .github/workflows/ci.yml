name: RegIntel RAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Code Quality & Syntax Check
        run: |
          python -m compileall app/ evaluation/ tests/

      - name: Run Test Suite
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: "test_regintel"
          GEMINI_API_KEY: "mock_test_key"
          MLFLOW_ENABLED: "false"
          LANGFUSE_ENABLED: "false"
        run: |
          pytest -v --ignore=tests/integration/test_db_live.py

      - name: Verify Backend Docker Container Build
        run: |
          docker build -t regintel-backend:ci-test .

  frontend-test:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: ESLint Validation
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit & Component Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify Frontend Docker Container Build
        run: |
          docker build -t regintel-frontend:ci-test ./frontend
