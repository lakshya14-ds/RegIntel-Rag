name: RegIntel RAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Code Quality & Syntax Check
        run: |
          python -m compileall app/ frontend/ evaluation/ tests/

      - name: Run Test Suite
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: "test_regintel"
          GEMINI_API_KEY: "mock_test_key"
          MLFLOW_ENABLED: "false"
          LANGFUSE_ENABLED: "false"
        run: |
          pytest -v --ignore=tests/integration/test_db_live.py

      - name: Verify Docker Container Build
        run: |
          docker build -t regintel-rag:ci-test .
