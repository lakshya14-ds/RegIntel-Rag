version: '3.8'

services:
  app:
    build: .
    container_name: regintel_rag_app
    ports:
      - "8501:8501"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=regintel_rag
      - MONGODB_COLLECTION_NAME=documents
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - .:/app

  mongo:
    image: mongo:latest
    container_name: regintel_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
