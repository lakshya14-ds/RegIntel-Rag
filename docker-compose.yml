version: '3.8'

services:
  # 1. FastAPI Backend Service (External MongoDB Atlas + Gemini API via .env)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regintel_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - MLFLOW_TRACKING_URI=sqlite:///app/data/mlflow.db
      - MLFLOW_EXPERIMENT_NAME=RegIntel-RAG
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data

  # 2. React + TypeScript + Vite Production Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: regintel_frontend
    ports:
      - "5173:80"
      - "8501:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
